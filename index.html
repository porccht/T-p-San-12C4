<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tập San Chi Đoàn 12C4 • Thanh Long ❤️‍🩹</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Bộ phông chữ viết tay thanh thoát, thư pháp & cổ điển Việt hóa đẹp mắt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Charm:wght@400;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600&family=Playpen+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --paper-bg: #fbf5e8;
      --paper-warm: #f6ecd7;
      --paper-edge: #e3d3b6;
      --ink-dark: #2c1e16;
      --ink-muted: #5c4332;
      --gold-primary: #c9933b;
      --gold-light: #f3d28c;
      --crimson-seal: #9e2a2b;
      --sage-accent: #3d6b58;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-editorial: 'Charm', 'Cormorant Garamond', cursive, serif;
      --font-hand: 'Playpen Sans', cursive, sans-serif;
      --font-script: 'Dancing Script', cursive;
      --font-bubble: 'Playfair Display', Georgia, serif;
      --font-sans: 'Be Vietnam Pro', sans-serif;
      --book-scale: 0.82;
      --mobile-book-scale: 0.88;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Pill Sticker for TOC Items - Hand-cut contour look with Page Number badge */
    .toc-sticker-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-align: left;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      cursor: pointer;
      filter: drop-shadow(0 3px 5px rgba(35, 18, 8, 0.28));
    }
    .toc-sticker-btn:hover {
      transform: scale(1.06) rotate(-1.5deg);
      filter: drop-shadow(0 6px 10px rgba(35, 18, 8, 0.38));
    }
    .toc-num-circle {
      width: 22px;
      height: 22px;
      border-radius: 52% 48% 46% 54% / 48% 52% 54% 46%;
      background: radial-gradient(circle at 32% 30%, #4a4542 0%, #1a1615 70%, #090707 100%);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #ffffff;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.45);
      flex-shrink: 0;
    }
    .toc-pill-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fffefb;
      color: #23140d;
      font-family: var(--font-editorial);
      font-size: 15.5px;
      font-weight: 700;
      padding: 2px 9px 2px 10px;
      border-radius: 14px 20px 16px 18px;
      border: 2px solid #ffffff;
      box-shadow:
        inset 0 0 0 1px rgba(198, 175, 142, 0.65),
        1.5px 2px 0 rgba(120, 88, 52, 0.25);
      white-space: nowrap;
      line-height: 1.25;
    }
    .toc-page-badge {
      font-family: var(--font-sans);
      font-size: 9px;
      font-weight: 800;
      color: #8c2d19;
      background: #f9ebe0;
      border: 1px solid #ddb89e;
      padding: 0.5px 4.5px;
      border-radius: 999px;
      letter-spacing: -0.02em;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: #140f0d;
      color: var(--ink-dark);
    }

    /* ==========================================================================
       AMBIENT WOOD & SUNLIGHT STUDIO BACKGROUND
       ========================================================================== */
    .studio-environment {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 200, 120, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(236, 114, 95, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #2a1d17 0%, #120c0a 100%);
      z-index: 0;
      overflow: hidden;
    }

    .sunlight-rays {
      position: absolute;
      inset: -20%;
      background:
        linear-gradient(125deg,
          transparent 20%,
          rgba(255, 223, 165, 0.05) 32%,
          rgba(255, 236, 195, 0.11) 38%,
          transparent 46%,
          rgba(255, 215, 145, 0.06) 58%,
          transparent 70%);
      pointer-events: none;
      animation: sunbeamDrift 16s ease-in-out infinite alternate;
    }

    @keyframes sunbeamDrift {
      0% { transform: translate3d(-2%, -1%, 0) rotate(-1deg); }
      100% { transform: translate3d(2%, 1%, 0) rotate(1.5deg); }
    }

    /* ==========================================================================
       iOS 18 / visionOS LIQUID GLASS UI SYSTEM
       ========================================================================== */
    .liquid-glass {
      position: relative;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.24) 0%,
        rgba(255, 255, 255, 0.10) 50%,
        rgba(255, 240, 220, 0.16) 100%
      );
      backdrop-filter: blur(26px) saturate(210%);
      -webkit-backdrop-filter: blur(26px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 16px 38px -8px rgba(0, 0, 0, 0.48),
        0 2px 10px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.65),
        inset 0 -1px 2px rgba(255, 215, 160, 0.22);
      border-radius: 9999px;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 45%);
      pointer-events: none;
    }

    .liquid-glass-card {
      position: relative;
      background: linear-gradient(
        145deg,
        rgba(40, 28, 22, 0.76) 0%,
        rgba(25, 17, 14, 0.84) 100%
      );
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.45);
      border-radius: 28px;
    }

    .liquid-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.55rem 1.05rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.08) 100%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.24s ease, background 0.25s ease;
      overflow: hidden;
    }

    .liquid-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 10px 24px rgba(255, 185, 95, 0.35),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.85);
    }

    .liquid-btn:active {
      transform: translateY(0) scale(0.96);
    }

    .liquid-btn-music-active {
      background: linear-gradient(135deg, rgba(255, 126, 95, 0.88) 0%, rgba(254, 180, 123, 0.88) 50%, rgba(245, 158, 11, 0.9) 100%);
      border-color: rgba(255, 245, 225, 0.85);
      box-shadow:
        0 8px 25px rgba(255, 136, 86, 0.55),
        0 0 16px rgba(254, 180, 123, 0.45),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.9);
      color: #23120b;
    }

    .liquid-btn-music-off {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.06) 100%);
      color: rgba(255, 255, 255, 0.85);
    }

    .liquid-btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #f97316 100%);
      color: #271509;
      border-color: rgba(255, 251, 235, 0.85);
      box-shadow:
        0 8px 22px rgba(245, 158, 11, 0.48),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.9);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      width: 16px;
    }

    .eq-bar {
      width: 3px;
      background: currentColor;
      border-radius: 3px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .playing .eq-bar:nth-child(1) { animation: eqBounce 0.75s ease-in-out infinite 0.0s; }
    .playing .eq-bar:nth-child(2) { animation: eqBounce 0.65s ease-in-out infinite 0.18s; }
    .playing .eq-bar:nth-child(3) { animation: eqBounce 0.85s ease-in-out infinite 0.32s; }
    .playing .eq-bar:nth-child(4) { animation: eqBounce 0.70s ease-in-out infinite 0.12s; }

    @keyframes eqBounce {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .social-container {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .liquid-social-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .liquid-social-link.fb:hover {
      background: rgba(24, 119, 242, 0.12);
      border-color: rgba(24, 119, 242, 0.6);
      box-shadow: 0 0 20px rgba(24, 119, 242, 0.35);
      transform: translateY(-2px);
    }
    .liquid-social-link.tk:hover {
      background: rgba(254, 44, 85, 0.12);
      border-color: rgba(254, 44, 85, 0.6);
      box-shadow: 0 0 20px rgba(254, 44, 85, 0.35);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       3D FLIPBOOK STAGE & LUXURY MAGAZINE ARCHITECTURE (AUTO-SCALED TO FIT 100% VIEWPORT)
       ========================================================================== */
    .stage-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 58px 12px 66px 12px;
      perspective: 2400px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .book-scene {
      position: relative;
      width: 960px;
      height: 640px;
      flex-shrink: 0;
      transform-style: preserve-3d;
      transform-origin: center center;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .book-scene.closed-front { transform: scale(var(--book-scale, 0.82)) translateX(-25%) rotateX(3deg); }
    .book-scene.open-spread { transform: scale(var(--book-scale, 0.82)) translateX(0%) rotateX(4deg); }
    .book-scene.closed-back { transform: scale(var(--book-scale, 0.82)) translateX(25%) rotateX(3deg); }

    .book-table-shadow {
      position: absolute;
      inset: 3% 1% -4% 1%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 55%, transparent 78%);
      filter: blur(22px);
      transform: translateZ(-28px);
      pointer-events: none;
    }

    .book-spine-3d {
      position: absolute;
      left: 50%;
      top: -3px;
      bottom: -3px;
      width: 30px;
      transform: translateX(-50%) translateZ(-4px);
      background: linear-gradient(90deg, #3b1c14, #6b3322, #8e4830, #d49b4b 50%, #7c3d28, #4a2218, #2b120c);
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 2;
      pointer-events: none;
    }

    .paper-stack-left, .paper-stack-right {
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 49.5%;
      background: var(--paper-bg);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .paper-stack-left { left: 0.5%; border-radius: 12px 0 0 12px; box-shadow: -12px 8px 18px rgba(0,0,0,0.45); }
    .paper-stack-right { right: 0.5%; border-radius: 0 12px 12px 0; box-shadow: 12px 8px 18px rgba(0,0,0,0.45); }

    .book-sheet {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.88s cubic-bezier(0.32, 0.72, 0, 1);
      cursor: grab;
      will-change: transform;
    }
    .book-sheet:active { cursor: grabbing; }
    .book-sheet.flipped { transform: rotateY(-180deg); }

    .sheet-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(139, 98, 59, 0.045) 1px, transparent 0),
        radial-gradient(rgba(139, 98, 59, 0.035) 1px, transparent 0);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    .sheet-front {
      border-radius: 0 14px 14px 0;
      border-left: 1px solid rgba(92, 67, 50, 0.18);
      box-shadow: inset 28px 0 38px -12px rgba(44, 30, 22, 0.22);
    }
    .sheet-back {
      transform: rotateY(180deg);
      border-radius: 14px 0 0 14px;
      border-right: 1px solid rgba(92, 67, 50, 0.18);
      box-shadow: inset -28px 0 38px -12px rgba(44, 30, 22, 0.22);
    }
    .book-sheet:not(.flipped) .sheet-back {
      pointer-events: none !important;
    }
    .book-sheet.flipped .sheet-front {
      pointer-events: none !important;
    }

    .page-turn-lighting {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease;
      background: linear-gradient(90deg, rgba(0,0,0,0.28) 0%, rgba(255,255,255,0.18) 45%, rgba(0,0,0,0.12) 100%);
      z-index: 30;
    }
    .book-sheet.turning .page-turn-lighting { opacity: 1; }

    .corner-curl-hint {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, transparent 48%, rgba(212, 189, 152, 0.65) 50%, #fdf8ef 62%, #d8c29d 100%);
      border-radius: 10px 0 14px 0;
      box-shadow: -3px -3px 8px rgba(0, 0, 0, 0.15);
      pointer-events: none;
      transition: width 0.3s ease, height 0.3s ease;
      z-index: 25;
    }
    .sheet-front:hover .corner-curl-hint { width: 58px; height: 58px; }
    .sheet-back .corner-curl-hint {
      right: auto;
      left: 0;
      background: linear-gradient(225deg, transparent 48%, rgba(212, 189, 152, 0.65) 50%, #fdf8ef 62%, #d8c29d 100%);
      border-radius: 0 10px 0 14px;
    }

    /* ==========================================================================
       MOBILE SINGLE-PAGE 3D FLIP ENGINE (<= 920px)
       ========================================================================== */
    .mobile-book-stage {
      display: none;
      position: relative;
      width: 440px;
      height: 640px;
      flex-shrink: 0;
      perspective: 1800px;
      transform-style: preserve-3d;
      transform-origin: center center;
      transform: scale(var(--mobile-book-scale, 0.88));
    }
    .mobile-spine-edge {
      position: absolute;
      left: -6px; top: 4px; bottom: 4px;
      width: 14px;
      background: linear-gradient(90deg, #3b1c14, #8e4830, #d49b4b, #4a2218);
      border-radius: 8px 0 0 8px;
      box-shadow: -3px 4px 14px rgba(0,0,0,0.55);
      z-index: 40;
    }
    .mobile-paper-stack {
      position: absolute;
      inset: 4px -6px 4px 4px;
      background: #efe3ce;
      border-radius: 4px 18px 18px 4px;
      box-shadow: 8px 8px 24px rgba(0,0,0,0.55);
    }
    .mobile-page-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(139, 98, 59, 0.045) 1px, transparent 0),
        radial-gradient(rgba(139, 98, 59, 0.035) 1px, transparent 0);
      background-size: 24px 24px;
      border-radius: 6px 18px 18px 6px;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.68s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.45s ease;
      box-shadow: inset 22px 0 32px -12px rgba(44, 30, 22, 0.24), 0 14px 34px rgba(0, 0, 0, 0.45);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-page-card.past-page { transform: rotateY(-112deg); opacity: 0; pointer-events: none; }
    .mobile-page-card.active-page { transform: rotateY(0deg); opacity: 1; z-index: 20; }
    .mobile-page-card.future-page { transform: rotateY(0deg) scale(0.99); opacity: 0; z-index: 10; pointer-events: none; }

    @media (max-width: 920px) {
      .book-scene { display: none !important; }
      .mobile-book-stage { display: block !important; }
      .stage-wrapper { padding: 54px 8px 64px 8px; }
    }

    /* ==========================================================================
       HANDMADE SCRAPBOOK STYLES (MỤC LỤC, LỜI NGỎ, LỊCH SỬ, PULL-DOWN)
       ========================================================================== */
    .font-display { font-family: var(--font-display); }
    .font-editorial { font-family: var(--font-editorial); }
    .font-hand { font-family: var(--font-hand); }
    .font-script { font-family: var(--font-script); }
    .font-bubble { font-family: var(--font-bubble); }

    .page-inner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 20px 22px 24px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(168, 128, 82, 0.4) transparent;
    }

    /* Grid Notebook Paper for Lời Ngỏ (Image 2) */
    .grid-notebook-sheet {
      background-color: #fcfaf5;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.25) 1px, transparent 1px);
      background-size: 18px 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    /* Sticky Note & Push-pin Styles for Page 4, 10, 12, 13 & 14 */
    .sticky-note-card {
      position: relative;
      padding: 8px 10px;
      border-radius: 3px 3px 12px 4px;
      box-shadow:
        0 8px 16px rgba(32, 18, 10, 0.18),
        0 2px 4px rgba(32, 18, 10, 0.12);
      font-family: var(--font-hand);
      height: fit-content;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .sticky-note-card.zoomable-photo-card {
      padding: 6px 6px 5px 6px;
      height: fit-content;
      align-self: start;
    }
    .sticky-note-card:hover {
      transform: scale(1.03) rotate(0deg) !important;
      box-shadow: 0 12px 24px rgba(32, 18, 10, 0.26);
      z-index: 25;
    }
    .push-pin-3d {
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, #ff758f 0%, #c9184a 65%, #590d22 100%);
      box-shadow:
        0 3px 5px rgba(0,0,0,0.4),
        inset 0 1.5px 2px rgba(255,255,255,0.7);
      z-index: 30;
    }
    .push-pin-3d::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 6px;
      width: 2px;
      height: 4px;
      background: #495057;
      border-radius: 1px;
    }
    .push-pin-gold {
      background: radial-gradient(circle at 35% 30%, #ffe066 0%, #f59f00 65%, #7c4d00 100%);
    }
    .push-pin-teal {
      background: radial-gradient(circle at 35% 30%, #63e6be 0%, #0ca678 65%, #084c38 100%);
    }

    /* Cutout 3D Title Effect */
    .cutout-3d-title {
      display: inline-block;
      background: #fffdf9;
      padding: 4px 18px 8px 18px;
      border-radius: 26px 20px 28px 22px;
      box-shadow:
        0 6px 12px rgba(44, 24, 16, 0.25),
        0 2px 4px rgba(44, 24, 16, 0.18),
        inset 0 0 0 2px #f3ead8;
      font-family: var(--font-script);
      font-weight: 700;
      color: #432314;
      text-shadow: 2px 2px 0px #d4b07b;
      position: relative;
    }

    .cutout-3d-red {
      display: inline-block;
      background: #fffdf9;
      padding: 2px 16px 6px 16px;
      border-radius: 24px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      font-family: var(--font-script);
      font-weight: 700;
      color: #c93b2b;
      text-shadow: 1.5px 1.5px 0px #f4c2b8;
    }

    /* Kraft Torn Paper */
    .kraft-torn-patch {
      position: relative;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,245,225,0.22) 0%, transparent 50%),
        linear-gradient(145deg, #cbb089 0%, #bfa074 52%, #b39265 100%);
      border-radius: 18px 28px 22px 26px;
      box-shadow:
        0 6px 16px rgba(60, 38, 18, 0.18),
        inset 0 0 24px rgba(85, 52, 24, 0.18);
      border: 2px dashed rgba(255, 250, 240, 0.45);
    }

    /* Blue Cutout Letters */
    .blue-cutout-word {
      background-color: #fcfaf5;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.22) 1px, transparent 1px);
      background-size: 12px 12px;
      color: #2b59c3;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.16);
      border: 1px solid #d8e2dc;
      text-align: center;
    }

    .washi-tape {
      position: absolute;
      width: 82px;
      height: 22px;
      background: rgba(235, 198, 142, 0.58);
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35), rgba(255,255,255,0.35) 6px, transparent 6px, transparent 12px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      z-index: 15;
      pointer-events: none;
    }
    .washi-rose { background-color: rgba(226, 135, 125, 0.52); }
    .washi-sage { background-color: rgba(114, 158, 133, 0.52); }

    .polaroid-card {
      background: #ffffff;
      padding: 8px 8px 20px 8px;
      border-radius: 4px;
      box-shadow: 0 8px 20px rgba(44, 30, 22, 0.16);
      border: 1px solid rgba(215, 200, 180, 0.7);
      transition: transform 0.3s ease;
    }
    .polaroid-card:hover {
      transform: scale(1.03) rotate(0deg) !important;
      z-index: 20;
    }

    .lined-paper {
      background-color: #fffdf7;
      background-image: linear-gradient(transparent 95%, rgba(105, 148, 198, 0.25) 95%);
      background-size: 100% 22px;
      line-height: 22px;
    }

    .drop-cap::first-letter {
      float: left;
      font-family: var(--font-display);
      font-size: 2.5rem;
      line-height: 0.85;
      padding-top: 3px;
      padding-right: 7px;
      color: var(--crimson-seal);
      font-weight: 800;
    }

    .cover-luxury {
      background: radial-gradient(circle at 50% 22%, rgba(235, 185, 102, 0.22) 0%, transparent 60%), linear-gradient(155deg, #4a1c17 0%, #2d110e 52%, #1d0b09 100%);
      color: #f9ebd2;
    }

    /* ==========================================================================
       NEW 3D MULTI-LAYERED SCRAPBOOK & WATERCOLOR SPLATTER BACKGROUNDS
       ========================================================================== */
    /* Inner Spiral Ring Strip on Left Edge of Scrapbook Pages */
    .spiral-edge-strip {
      position: absolute;
      left: 4px;
      top: 12px;
      bottom: 12px;
      width: 18px;
      z-index: 30;
      pointer-events: none;
      background-image: radial-gradient(circle at 11px 10px, #2b211c 4.2px, rgba(0,0,0,0.18) 5px, transparent 5.5px);
      background-size: 18px 26px;
    }
    .spiral-edge-strip::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(180deg, transparent 5px, #d4d9e2 5px, #ffffff 7.5px, #7b8494 10.5px, transparent 12px);
      background-size: 12px 26px;
      background-repeat: repeat-y;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.45));
    }

        radial-gradient(circle at 76% 84%, rgba(235, 130, 158, 0.45) 0 8px, transparent 9px),

    /* Die-cut Grid Paper Patches */
    .grid-cutout-patch {
      position: relative;
      background-color: #fffef9;
      background-image:
        linear-gradient(to right, rgba(135, 152, 174, 0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(135, 152, 174, 0.28) 1px, transparent 1px);
      background-size: 14px 14px;
      border-radius: 12px 18px 14px 20px;
      border: 1.5px solid #ffffff;
      box-shadow:
        0 6px 12px rgba(36, 20, 12, 0.18),
        0 2px 4px rgba(36, 20, 12, 0.14),
        2px 3px 0px rgba(235, 224, 205, 0.9);
    }

    .diecut-sticker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 12px;
      border: 2px solid #ffffff;
      box-shadow:
        0 5px 10px rgba(28, 16, 10, 0.22),
        0 1.5px 3px rgba(28, 16, 10, 0.16);
    }

    /* Sheet Music Stave Lines for Page 9 (Bụi Phấn) */
    .music-stave-row {
      position: relative;
      height: 24px;
      width: 100%;
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(234, 198, 118, 0.85) 0px,
        rgba(234, 198, 118, 0.85) 1px,
        transparent 1px,
        transparent 4.5px
      );
      background-size: 100% 19px;
      background-repeat: no-repeat;
      margin-bottom: 1px;
    }

    /* Animated Music Notes & Equalizer on Page 9 */
    @keyframes floatMusicNote {
      0%, 100% { transform: translateY(0px) rotate(-6deg) scale(1); opacity: 0.75; }
      50% { transform: translateY(-7px) rotate(8deg) scale(1.12); opacity: 1; }
    }
    @keyframes staffWaveGlow {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(180, 83, 9, 0)); }
      50% { filter: drop-shadow(0 1px 4px rgba(217, 119, 6, 0.35)); }
    }
    @keyframes barDance {
      0%, 100% { height: 5px; }
      50% { height: 16px; }
    }
    .floating-note-anim {
      animation: floatMusicNote 3.2s ease-in-out infinite;
    }
    .floating-note-anim-delay {
      animation: floatMusicNote 3.8s ease-in-out 1.1s infinite;
    }
    .stave-anim-glow {
      animation: staffWaveGlow 4s ease-in-out infinite;
    }
    .music-bar-anim {
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(180deg, #b45309, #d97706);
      animation: barDance 0.8s ease-in-out infinite;
    }

    /* Interactive Photo Zoom Lightbox Modal (All Photos) */
    .zoomable-photo-card {
      cursor: zoom-in;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.32s ease;
    }
    .zoomable-photo-card img {
      cursor: zoom-in;
    }
    .zoomable-photo-card:hover {
      transform: scale(1.04) rotate(0deg) !important;
      box-shadow: 0 14px 28px rgba(32, 18, 10, 0.28);
      z-index: 30;
    }
    #photo-zoom-overlay {
      z-index: 100;
      transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s ease;
    }
    #photo-zoom-card {
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* TOC Modern Editorial Leader Line */
    .toc-modern-row {
      display: flex;
      align-items: baseline;
      width: 100%;
      padding: 3.5px 6px;
      border-radius: 6px;
      text-align: left;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .toc-modern-row:hover {
      background: rgba(244, 114, 182, 0.12);
      transform: translateX(3px);
    }
    .toc-modern-title {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      color: #2c1e16;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 78%;
    }
    .toc-modern-row:hover .toc-modern-title {
      color: #9e2a2b;
      font-weight: 700;
    }

      font-size: 11px;
      font-weight: 700;
      color: #4a3525;
      flex-shrink: 0;
    }

    /* Ultra-detailed Hand-cut Stepped Grid Paper */
    .stepped-grid-poem {
      position: relative;
      background-color: #fffef9;
      background-image:
        linear-gradient(to right, rgba(110, 132, 160, 0.34) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(110, 132, 160, 0.34) 1px, transparent 1px);
      background-size: 11px 11px;
      border: 2px solid #ffffff;
      box-shadow:

        2.5px 3.5px 0px rgba(215, 200, 176, 0.95);
      border-radius: 8px 14px 10px 16px;
    }

    /* Individual Scissor-Cut Line Strip on Grid Paper */
    .grid-line-strip {
      display: inline-block;
      background-color: #fffef9;
      background-image:
        linear-gradient(to right, rgba(110, 132, 160, 0.34) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(110, 132, 160, 0.34) 1px, transparent 1px);
      background-size: 10px 10px;
      padding: 1px 10px;
      margin: -1px 0;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      box-shadow: 2px 2px 4px rgba(30, 16, 10, 0.14);
      border-radius: 4px;
    }

    /* Crumpled Kraft Paper Texture */
    .kraft-crumpled-surface {
      background-color: #c5a880;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(255, 245, 228, 0.35) 0%, transparent 45%),

        linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(0,0,0,0.1) 50%, rgba(255,255,255,0.12) 100%),
        linear-gradient(160deg, #ccb18b 0%, #bea076 48%, #ad8d62 100%);
    }

    /* Overlapping Translucent Washi Dots */
    .washi-dot-circle {
      width: 24px;
      height: 24px;

      document.documentElement.style.setProperty('--book-scale', desktopScale.toFixed(3));
      document.documentElement.style.setProperty('--mobile-book-scale', mobileScale.toFixed(3));

    }

    // Nội dung Lời Kết dùng cho hiệu ứng chữ chạy từng chữ (Typewriter) ở Trang 15
    const LOI_KET_FULL_TEXT = "Hôm nay, trong không khí ấm áp và trang trọng của ngày Nhà giáo Việt Nam 20/11, chúng em xin dành sự biết ơn chân thành nhất đến thầy cô – những người đã gieo mầm tri thức và định hướng ước mơ cho chúng em. Mỗi bài giảng, mỗi lời động viên của thầy cô như ngọn lửa thắp sáng hoài bão tuổi trẻ, giúp chúng em mạnh mẽ vững bước trên đường đời. Nhân ngày 20/11, tập thể Chi Đoàn 12C4 (Khóa 2024 - 2027) – THPT Thiệu Hóa kính chúc quý thầy cô luôn dồi dào sức khỏe, hạnh phúc và gặt hái nhiều thành công trong sự nghiệp trồng người cao cả. Cảm ơn thầy cô vì tất cả!";
    let loiKetTypewriterTimer = null;
    let wasOnLoiKetPage = false;

    function startLoiKetTypewriter() {
      const boxes = document.querySelectorAll('.loiket-typewriter-box');
      if (!boxes.length) return;
      if (loiKetTypewriterTimer) {
        clearInterval(loiKetTypewriterTimer);
        loiKetTypewriterTimer = null;
      }

      let charIndex = 0;
      boxes.forEach((b) => { b.textContent = ''; });

      loiKetTypewriterTimer = setInterval(() => {
        charIndex += 2;
        const currentSlice = LOI_KET_FULL_TEXT.slice(0, charIndex);
        boxes.forEach((b) => {
          b.textContent = currentSlice;
          if (b.parentElement) {
            b.parentElement.scrollTop = b.parentElement.scrollHeight;
          }
        });
        if (charIndex >= LOI_KET_FULL_TEXT.length) {
          clearInterval(loiKetTypewriterTimer);
          loiKetTypewriterTimer = null;
        }
      }, 24);
    }

    // Tự động điều phối âm lượng nhạc nền, phát bài Bụi Phấn ở Trang 8-9 & tự phát Video + Chữ chạy ở Trang 15
    function syncPageSpecificAudio(flippedCount) {
      const bgAudio = document.getElementById('bg-audio-element');
      const bpAudio = document.getElementById('buiphan-audio-element');
      if (!bgAudio || !bpAudio) return;

      const isOnBuiPhanPages = isMobileMode
        ? (currentPageNumber === 8 || currentPageNumber === 9)
        : (flippedCount === 4);

      const isOnLoiKetPage = isMobileMode
        ? (currentPageNumber === 15)
        : (flippedCount === 7);

      const desktopVideo = document.querySelector('#desktop-sheets-root .loiket-video-player');
      const mobileVideo = document.querySelector('#mobile-pages-root .loiket-video-player');
      const activeVideo = isMobileMode ? mobileVideo : desktopVideo;
      const inactiveVideo = isMobileMode ? desktopVideo : mobileVideo;

      if (inactiveVideo && !inactiveVideo.paused) {
        inactiveVideo.pause();
      }

      if (isOnLoiKetPage) {
        if (!wasOnLoiKetPage) {
          wasOnLoiKetPage = true;
          startLoiKetTypewriter();
        }
        if (activeVideo) {
          activeVideo.muted = false;
          activeVideo.volume = 0.95;
          if (activeVideo.paused) {
            activeVideo.play().catch(() => {
              activeVideo.muted = true;
              activeVideo.play().catch(() => {});
            });
          }
        }
      } else {
        wasOnLoiKetPage = false;
        if (desktopVideo && !desktopVideo.paused) {
          desktopVideo.pause();
        }
        if (mobileVideo && !mobileVideo.paused) {
          mobileVideo.pause();
        }
      }

      if (isOnBuiPhanPages) {
        bgAudio.volume = 0.32;
        if (isMusicPlaying && bgAudio.paused) {
          bgAudio.play().catch(() => {});
        }
        if (!isBuiPhanPlaying) {
          isBuiPhanPlaying = true;
          bpAudio.volume = 0.62;
          bpAudio.play().catch(() => {});
          bpAudio.onended = () => {
            isBuiPhanPlaying = false;
          };
        }
      } else {
        if (isBuiPhanPlaying || !bpAudio.paused) {
          bpAudio.pause();
          bpAudio.currentTime = 0;
          isBuiPhanPlaying = false;
        }
        bgAudio.volume = isOnLoiKetPage ? 0.22 : 0.85;
        if (isMusicPlaying && bgAudio.paused) {
          bgAudio.play().catch(() => {});
        }
      }
    }

    // Hiệu ứng Phóng To / Thu Nhỏ (Zoom In / Zoom Out) khi chạm vào bất kỳ ảnh nào
    let isZoomModalOpen = false;
    function openPhotoZoomModal(cardEl, event) {
      if (event) {
        event.stopPropagation();
      }
      const overlay = document.getElementById('photo-zoom-overlay');
      const zoomCard = document.getElementById('photo-zoom-card');
      const zoomImg = document.getElementById('photo-zoom-img');
      const zoomCaption = document.getElementById('photo-zoom-caption');
      if (!overlay || !zoomCard || !zoomImg) return;

      const imgEl = (cardEl && cardEl.tagName === 'IMG') ? cardEl : (cardEl ? cardEl.querySelector('img') : null);
      if (!imgEl) return;

      const hostCard = imgEl.closest('[data-caption]');
      zoomImg.src = imgEl.src;
      zoomCaption.textContent = (hostCard && hostCard.dataset.caption) || (cardEl && cardEl.dataset && cardEl.dataset.caption) || imgEl.alt || 'Kỷ niệm Chi Đoàn 12C4 (2024 - 2027)';

      overlay.classList.remove('opacity-0', 'invisible');
      overlay.classList.add('opacity-100', 'visible');
      zoomCard.classList.remove('scale-75');
      zoomCard.classList.add('scale-100');
      isZoomModalOpen = true;
      playTributeChime();
    }

    function closePhotoZoomModal() {
      const overlay = document.getElementById('photo-zoom-overlay');
      const zoomCard = document.getElementById('photo-zoom-card');
      if (!overlay || !zoomCard) return;

      overlay.classList.add('opacity-0', 'invisible');
      overlay.classList.remove('opacity-100', 'visible');
      zoomCard.classList.add('scale-75');
      zoomCard.classList.remove('scale-100');
      isZoomModalOpen = false;
    }

    // Hiệu ứng kéo / chạm bất kỳ đâu trong khung đỏ ở Trang 5 để xổ chuỗi ảnh kỷ niệm THPT Thiệu Hóa
    let isPullDrawerOpen = false;
    function togglePullDrawer(event) {
      if (event) {
        // Nếu người dùng chạm trực tiếp vào bức ảnh bên trong khung đỏ thì ưu tiên phóng to ảnh đó
        if (event.target.closest('img')) return;
        event.stopPropagation();
      }
      isPullDrawerOpen = !isPullDrawerOpen;
      const drawers = document.querySelectorAll('#thieuhoa-pull-drawer');
      const mainTexts = document.querySelectorAll('.pull-main-text');
      const subTexts = document.querySelectorAll('.pull-sub-text');

      drawers.forEach((d) => {
        if (isPullDrawerOpen) {
          d.classList.remove('max-h-0');
          d.classList.add('max-h-[340px]', 'py-1');
        } else {
          d.classList.add('max-h-0');
          d.classList.remove('max-h-[340px]', 'py-1');
        }
      });

      mainTexts.forEach((t) => {
        t.textContent = isPullDrawerOpen ? 'PUSH ↑' : 'PULL ↓';
      });
      subTexts.forEach((s) => {
        s.textContent = isPullDrawerOpen ? '(chạm khung đỏ để thu gọn) ♡' : '(chạm khung đỏ để kéo xuống) nhẹ tay ♡';
      });

      playRealisticPaperFlipSound();
    }

    function syncBookVisualState(playSound = true) {
      isMobileMode = window.innerWidth <= 920;

      if (playSound && isFlipSfxEnabled) {
        playRealisticPaperFlipSound();
      }

      const flippedCount = getDesktopFlippedCountFromPage(currentPageNumber);
      const desktopBook = document.getElementById('desktop-book');
      const stackLeft = document.getElementById('stack-left');
      const stackRight = document.getElementById('stack-right');

      desktopBook.classList.remove('closed-front', 'open-spread', 'closed-back');
      if (flippedCount === 0) {
        desktopBook.classList.add('closed-front');
        stackLeft.style.opacity = '0';
        stackRight.style.opacity = '1';
      } else {
        desktopBook.classList.add('open-spread');
        stackLeft.style.opacity = '1';
        stackRight.style.opacity = '1';
      }

      for (let s = 0; s < TOTAL_SHEETS; s++) {
        const sheetEl = document.getElementById(`desktop-sheet-${s}`);
        if (!sheetEl) continue;

        sheetEl.classList.add('turning');
        setTimeout(() => sheetEl.classList.remove('turning'), 650);

        if (s < flippedCount) {
          sheetEl.classList.add('flipped');
          sheetEl.style.zIndex = 10 + s;
          sheetEl.style.pointerEvents = (s === flippedCount - 1) ? 'auto' : 'none';
        } else {
          sheetEl.classList.remove('flipped');
          sheetEl.style.zIndex = 30 - s;
          sheetEl.style.pointerEvents = (s === flippedCount) ? 'auto' : 'none';
        }
      }

      for (let p = 1; p <= TOTAL_PAGES; p++) {
        const cardEl = document.getElementById(`mobile-page-${p}`);
        if (!cardEl) continue;
        cardEl.classList.remove('past-page', 'active-page', 'future-page');

        if (p < currentPageNumber) {
          cardEl.classList.add('past-page');
          cardEl.style.zIndex = p;
        } else if (p === currentPageNumber) {
          cardEl.classList.add('active-page');
          cardEl.style.zIndex = 30;
        } else {
          cardEl.classList.add('future-page');
          cardEl.style.zIndex = 25 - p;
        }
      }

      const indicatorEl = document.getElementById('page-indicator-text');
      if (isMobileMode) {
        const pageObj = PAGES_DATA[currentPageNumber - 1];
        indicatorEl.textContent = `Trang ${currentPageNumber}/${TOTAL_PAGES} • ${pageObj.badge}`;
      } else {
        if (flippedCount === 0) {
          indicatorEl.textContent = `Bìa Trước (Trang 1 / ${TOTAL_PAGES})`;
        } else {
          const leftPage = flippedCount * 2;
          const rightPage = Math.min(TOTAL_PAGES, leftPage + 1);
          indicatorEl.textContent = `Trang ${leftPage} – ${rightPage} / ${TOTAL_PAGES}`;
        }
      }

      for (let p = 1; p <= TOTAL_PAGES; p++) {
        const dot = document.getElementById(`nav-dot-${p}`);
        if (!dot) continue;
        let isActive = false;
        if (isMobileMode) {
          isActive = (p === currentPageNumber);
        } else {
          if (flippedCount === 0 && p === 1) isActive = true;
          else if (flippedCount > 0 && (p === flippedCount * 2 || p === flippedCount * 2 + 1)) {
            isActive = true;
          }
        }
        dot.className = isActive
          ? 'w-5 h-2 rounded-full transition-all duration-300 bg-amber-400 shadow-[0_0_8px_#fbbf24]'
          : 'w-2 h-2 rounded-full transition-all duration-300 bg-white/35 hover:bg-amber-300';
      }

      document.getElementById('btn-prev').disabled = (currentPageNumber <= 1);
      document.getElementById('btn-next').disabled = isMobileMode
        ? (currentPageNumber >= TOTAL_PAGES)
        : (flippedCount >= MAX_DESKTOP_FLIPPED);

      syncPageSpecificAudio(flippedCount);
    }

    function turnNext() {
      unlockAudioImmediately();
      if (isMobileMode) {
        if (currentPageNumber < TOTAL_PAGES) {
          currentPageNumber++;
          syncBookVisualState(true);
        }
      } else {
        const flipped = getDesktopFlippedCountFromPage(currentPageNumber);
        if (flipped < MAX_DESKTOP_FLIPPED) {
          const nextFlipped = flipped + 1;
          currentPageNumber = nextFlipped * 2;
          syncBookVisualState(true);
        }
      }
    }

    function turnPrev() {
      unlockAudioImmediately();
      if (isMobileMode) {
        if (currentPageNumber > 1) {
          currentPageNumber--;
          syncBookVisualState(true);
        }
      } else {
        const flipped = getDesktopFlippedCountFromPage(currentPageNumber);
        if (flipped > 0) {
          const prevFlipped = flipped - 1;
          currentPageNumber = prevFlipped === 0 ? 1 : prevFlipped * 2;
          syncBookVisualState(true);
        }
      }
    }

    function jumpToPage(targetPage) {
      unlockAudioImmediately();
      currentPageNumber = Math.max(1, Math.min(TOTAL_PAGES, targetPage));
      syncBookVisualState(true);
    }

    function handleDesktopSheetClick(sheetIndex, face, event) {
      if (event.target.closest('button, input, form, a, video, .zoomable-photo-card')) return;
      unlockAudioImmediately();

      const flipped = getDesktopFlippedCountFromPage(currentPageNumber);
      if (face === 'front' && sheetIndex === flipped && flipped < MAX_DESKTOP_FLIPPED) {
        turnNext();
      } else if (face === 'back' && sheetIndex === flipped - 1) {
        turnPrev();
      }
    }

    function initTouchAndDragGestures() {
      const stage = document.getElementById('book-touch-zone');
      let startX = 0;
      let startY = 0;
      let currentDeltaX = 0;
      let isDragging = false;
      let isHorizontalSwipe = null;

      // Chỉ phóng to các ảnh kỷ niệm nằm trong khung .zoomable-photo-card (không phóng to ảnh nền trang Mục lục, Lời ngỏ, Bụi phấn)
      stage.addEventListener('click', (e) => {
        const zoomCard = e.target.closest('.zoomable-photo-card');
        if (zoomCard) {
          openPhotoZoomModal(zoomCard, e);
        }
      });

      stage.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, input, form, a, video, .zoomable-photo-card')) return;
        unlockAudioImmediately();
        startX = e.clientX;
        startY = e.clientY;
        currentDeltaX = 0;
        isDragging = true;
        isHorizontalSwipe = null;
      }, { passive: true });

      stage.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (isHorizontalSwipe === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
          isHorizontalSwipe = Math.abs(dx) > Math.abs(dy) * 1.15;
        }

        if (isHorizontalSwipe) {
          currentDeltaX = dx;
          if (isMobileMode) {
            const activeCard = document.getElementById(`mobile-page-${currentPageNumber}`);
            if (activeCard && dx < 0 && currentPageNumber < TOTAL_PAGES) {
              const angle = Math.max(-45, (dx / 260) * 45);
              activeCard.style.transition = 'none';
              activeCard.style.transform = `rotateY(${angle}deg)`;
            }
          }
        }
      }, { passive: true });

      const finishGesture = () => {
        if (!isDragging) return;
        isDragging = false;

        if (isMobileMode) {
          const activeCard = document.getElementById(`mobile-page-${currentPageNumber}`);
          if (activeCard) {
            activeCard.style.transition = '';
            activeCard.style.transform = '';
          }
        }

        if (isHorizontalSwipe && Math.abs(currentDeltaX) > 36) {
          if (currentDeltaX < 0) {
            turnNext();
          } else {
            turnPrev();
          }
        }
        currentDeltaX = 0;
        isHorizontalSwipe = null;
      };

      stage.addEventListener('pointerup', finishGesture, { passive: true });
      stage.addEventListener('pointercancel', finishGesture, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'Escape' && isZoomModalOpen) {
          closePhotoZoomModal();
          return;
        }
        if (e.key === 'ArrowRight') turnNext();
        if (e.key === 'ArrowLeft') turnPrev();
      });

      window.addEventListener('resize', () => {
        updateBookViewportScale();
        const wasMobile = isMobileMode;
        isMobileMode = window.innerWidth <= 920;
        if (wasMobile !== isMobileMode) {
          syncBookVisualState(false);
        }
      });
    }

    // --- GitHub MP3 Audio Controls ---
    function unlockAudioImmediately() {
      const audioEl = document.getElementById('bg-audio-element');
      if (audioEl && isMusicPlaying) {
        const flippedCount = getDesktopFlippedCountFromPage(currentPageNumber);
        const isOnBuiPhan = isMobileMode
          ? (currentPageNumber === 8 || currentPageNumber === 9)
          : (flippedCount === 4);
        const isOnLoiKet = isMobileMode
          ? (currentPageNumber === 15)
          : (flippedCount === 7);
        audioEl.volume = isOnBuiPhan ? 0.32 : (isOnLoiKet ? 0.22 : 0.85);
        audioEl.play().catch(() => {});
      }
    }

    function toggleBackgroundMusic() {
      const bgAudio = document.getElementById('bg-audio-element');
      isMusicPlaying = !isMusicPlaying;
      if (bgAudio) {
        if (isMusicPlaying) {
          const flippedCount = getDesktopFlippedCountFromPage(currentPageNumber);
          const isOnBuiPhan = isMobileMode
            ? (currentPageNumber === 8 || currentPageNumber === 9)
            : (flippedCount === 4);
          const isOnLoiKet = isMobileMode
            ? (currentPageNumber === 15)
            : (flippedCount === 7);
          bgAudio.volume = isOnBuiPhan ? 0.32 : (isOnLoiKet ? 0.22 : 0.85);
          bgAudio.play().catch(() => {});
        } else {
          bgAudio.pause();
        }
      }
      updateMusicButtonUI();
    }

    function updateMusicButtonUI() {
      const btn = document.getElementById('btn-music-toggle');
      const label = document.getElementById('music-status-label');
      if (!btn || !label) return;

      if (isMusicPlaying) {
        btn.classList.add('liquid-btn-music-active', 'playing');
        btn.classList.remove('liquid-btn-music-off');
        label.textContent = 'Nhạc: BẬT';
      } else {
        btn.classList.remove('liquid-btn-music-active', 'playing');
        btn.classList.add('liquid-btn-music-off');
        label.textContent = 'Nhạc: TẮT';
      }
    }

    function getOrCreateAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function playRealisticPaperFlipSound() {
      try {
        const ctx = getOrCreateAudioContext();
        if (!ctx) return;

        const duration = 0.28;
        const bufferSize = ctx.sampleRate * duration;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = white * Math.sin((i / bufferSize) * Math.PI);
        }

        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + duration);
        filter.Q.setValueAtTime(1.8, ctx.currentTime);

        const gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.01, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.24, ctx.currentTime + 0.045);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);

        whiteNoise.start(ctx.currentTime);
        whiteNoise.stop(ctx.currentTime + duration);
      } catch (err) {}
    }

    function playTributeChime(event) {
      if (event) event.stopPropagation();
      unlockAudioImmediately();
      try {
        const ctx = getOrCreateAudioContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.11);

          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.11);
          gain.gain.linearRampToValueAtTime(0.14, ctx.currentTime + idx * 0.11 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + idx * 0.11 + 0.9);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.11);
          osc.stop(ctx.currentTime + idx * 0.11 + 0.95);
        });
      } catch (e) {}
    }

    function handleAddWish(event) {
      event.preventDefault();
      event.stopPropagation();
      const form = event.target;
      const sender = form.sender.value.trim().replace(/</g, '&lt;');
      const message = form.message.value.trim().replace(/</g, '&lt;');
      if (!sender || !message) return;

      const selectedColorInput = form.querySelector('input[name="noteColor"]:checked');
      const chosenColor = selectedColorInput ? selectedColorInput.value : 'bg-[#fff3b0] border-amber-300';
      const rotations = ['-1.4deg', '1.2deg', '-0.8deg', '1.5deg'];
      const pins = ['', 'push-pin-gold', 'push-pin-teal'];
      const chosenRot = rotations[Math.floor(Math.random() * rotations.length)];
      const chosenPin = pins[Math.floor(Math.random() * pins.length)];

      // Lưu trực tiếp vào SAVED_WISHES và lưu vĩnh viễn vào localStorage
      SAVED_WISHES.unshift({
        sender,
        message,
        color: chosenColor,
        rot: chosenRot,
        pin: chosenPin
      });

      saveWishesToStorage(SAVED_WISHES);
      renderAndAutoFitWishes();
      form.reset();
      playTributeChime();
    }

    function toggleTocModal() {
      const modal = document.getElementById('toc-modal');
      if (modal.classList.contains('opacity-0')) {
        modal.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        modal.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      buildFlipbookDOM();
      initTouchAndDragGestures();

      const audioEl = document.getElementById('bg-audio-element');
      if (audioEl) {
        audioEl.play().catch(() => {
          console.log("Autoplay blocked, waiting for user gesture.");
        });
      }

      ['pointerdown', 'touchstart', 'keydown'].forEach((evtName) => {
        window.addEventListener(evtName, unlockAudioImmediately, { once: true, passive: true });
      });
    });
  </script>
